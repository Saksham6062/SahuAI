name: Build Windows EXE

# Builds a single-file portable SahuAI.exe (Electron, bundles the app
# offline) and commits it to the repo root - the same directory as
# indexv0.1.html / index.html.
#
# Rebuild anytime: Actions tab -> Build Windows EXE -> Run workflow.
# (It also auto-runs when this workflow file itself changes.)

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-exe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exe:
    name: Build SahuAI.exe (Electron portable)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build portable EXE with Electron
        shell: bash
        run: |
          mkdir -p exebuild/app
          cp indexv0.1.html exebuild/app/index.html
          cd exebuild
          cat > package.json <<'EOF'
          {
            "name": "sahuai",
            "productName": "SahuAI",
            "version": "1.0.0",
            "description": "SahuAI - Official Saksham Intelligence AI Models Chat",
            "main": "main.js",
            "author": "Saksham6062",
            "build": {
              "appId": "com.saksham.sahuai",
              "productName": "SahuAI",
              "compression": "maximum",
              "files": [ "main.js", "app/**" ],
              "win": { "target": [ { "target": "portable", "arch": [ "x64" ] } ] },
              "portable": { "artifactName": "SahuAI.exe" }
            }
          }
          EOF
          cat > main.js <<'EOF'
          const { app, BrowserWindow, Menu, shell } = require('electron');
          const path = require('path');
          function createWindow () {
            const win = new BrowserWindow({
              width: 1280,
              height: 820,
              autoHideMenuBar: true,
              backgroundColor: '#0b1020',
              webPreferences: {
                webSecurity: false,
                contextIsolation: true,
                nodeIntegration: false
              }
            });
            win.loadFile(path.join(__dirname, 'app', 'index.html'));
          }
          app.whenReady().then(function () { Menu.setApplicationMenu(null); createWindow(); });
          app.on('window-all-closed', function () { if (process.platform !== 'darwin') app.quit(); });
          app.on('web-contents-created', function (e, wc) {
            wc.setWindowOpenHandler(function (o) { shell.openExternal(o.url); return { action: 'deny' }; });
          });
          EOF
          npm install --no-audit --no-fund --save-dev electron@28.3.3 electron-builder@24.13.3
          npx electron-builder --win portable --x64 --publish never
          cp dist/SahuAI.exe "$GITHUB_WORKSPACE/SahuAI.exe"
          ls -la "$GITHUB_WORKSPACE/SahuAI.exe"

      - name: Commit EXE to repo root
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SahuAI.exe
          git commit -m "build: add SahuAI.exe (Electron portable build) [skip ci]" || echo "no changes"
          git push
